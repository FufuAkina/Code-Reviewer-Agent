version: '3.8'

services:
  agentharness:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentharness:latest
    container_name: agentharness
    
    # 环境变量（从.env文件读取）
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    
    # 挂载目录（持久化数据）
    volumes:
      - ./harness_states:/app/harness_states
      - ./harness_reports:/app/harness_reports
    
    # 重启策略
    restart: unless-stopped
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
